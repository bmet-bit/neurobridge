name: Python CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.13.7
      - run: uv sync --locked --all-extras --no-editable --python "${{ matrix.python }}"
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - name: Run offline integration tests
        run: uv run --no-sync pytest -q -m 'not real'
      - name: Run the pinned PhysioNet round trip
        if: matrix.python == '3.11'
        run: |
          uv run --no-sync neurobridge fetch-demo .local/physionet
          NEUROBRIDGE_REAL_EDF=.local/physionet/S001R03.edf uv run --no-sync pytest -q -m real
      - name: Execute the example notebook
        if: matrix.python == '3.11'
        run: uv run --no-sync jupyter execute --timeout=120 examples/real_eeg.ipynb
      - run: uv run --no-sync python -m build
